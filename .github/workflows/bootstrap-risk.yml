name: Initialize risk baseline

on:
  workflow_dispatch:
    inputs:
      cutoff:
        description: "Optional UTC ISO-8601 or millisecond cutoff; blank uses the latest closed 15m bar"
        required: false
        default: ""
        type: string
      publish:
        description: "Required explicit confirmation to publish global_risk"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bootstrap-risk:
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: sol-alerts-production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12.10"
      - name: Install research package
        run: python -m pip install -e .
      - name: Download, validate, and publish risk-v1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASELINE_CUTOFF: ${{ inputs.cutoff }}
        shell: bash
        run: |
          args=(--cache-dir "$RUNNER_TEMP/sol-alerts-risk-bootstrap" --output "$RUNNER_TEMP/risk-v1.json" --publish)
          if [ -n "$BASELINE_CUTOFF" ]; then args+=(--as-of "$BASELINE_CUTOFF"); fi
          python -m sol_alerts.bootstrap "${args[@]}"
